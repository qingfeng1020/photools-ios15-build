name: Build iOS 15 IPA
on:
  push:
    paths:
      - ".github/workflows/build-ios15.yml"
      - "PhotoolsMobile-iOS15-cloud-build.zip"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: macos-15
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Extract modified source
        run: unzip -o PhotoolsMobile-iOS15-cloud-build.zip
      - name: Install XcodeGen
        run: brew install xcodegen
      - name: Normalize shell script
        run: python3 -c "from pathlib import Path; p=Path('apps/ios/PhotoolsMobile/tools/build-ios15-ipa.sh'); p.write_bytes(p.read_bytes().replace(bytes([13,10]), bytes([10])))"
      - name: Fix platform navigation style
        run: python3 -c "from pathlib import Path; p=Path('apps/ios/PhotoolsMobile/Sources/PhotoolsMobileCore/Views/CompatibleNavigationView.swift'); p.write_text(p.read_text().replace('.navigationViewStyle(.stack)', ''))"
      - name: Test and build IPA
        run: bash apps/ios/PhotoolsMobile/tools/build-ios15-ipa.sh
      - name: Upload IPA
        uses: actions/upload-artifact@v4
        with:
          name: PhotoolsMobile-iOS15-arm64
          path: apps/ios/PhotoolsMobile/dist/*.ipa
          if-no-files-found: error
          retention-days: 7
